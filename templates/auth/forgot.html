{% extends 'auth/layout.html' %}{% block box %}<h2>Reset your password</h2><p class="muted">Enter your email and we'll send a reset link.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label for="e">Email</label><input id="e" name="email" type="email" required autofocus></div><button class="btn primary lg block">Send reset link</button></form>
<p style="text-align:center;margin-top:20px"><a class="muted" href="{{ url_for('auth.login') }}">← Back to log in</a></p>{% endblock %}
