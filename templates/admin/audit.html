{% extends 'admin/layout.html' %}{% block page %}<h1 style="font-size:28px;margin-bottom:14px">Audit log</h1><div class="panel tbl"><table><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th><th>Detail</th></tr>{% for l in logs %}<tr><td>{{ l.created|dt('%d %b %H:%M') }}</td><td>{{ l.admin.name if l.admin else '—' }}</td><td>{{ l.action }}</td><td>{{ l.target }}</td><td class="muted">{{ l.detail }}</td></tr>{% endfor %}</table></div>{% endblock %}
