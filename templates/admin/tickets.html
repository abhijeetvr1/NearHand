{% extends 'admin/layout.html' %}{% block page %}<h1 style="font-size:28px;margin-bottom:14px">Support tickets</h1>
{% for t in tickets %}<div class="panel stack" style="margin-bottom:12px;--g:6px"><div class="row between"><b>{{ t.subject }}</b><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="id" value="{{ t.id }}"><button class="btn sm">{{ 'Close ticket' if t.status=='open' else 'Reopen' }}</button></form></div><div class="muted sm">{{ t.email }} · {{ t.created|ago }} · {{ t.status }}</div><p>{{ t.body }}</p></div>{% else %}<div class="empty"><h3>No tickets</h3></div>{% endfor %}{% endblock %}
