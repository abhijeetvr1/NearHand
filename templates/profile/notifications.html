{% extends 'base.html' %}{% block content %}<div class="narrow" style="margin:0 auto"><div class="row between" style="margin-bottom:16px"><h1 style="font-size:28px">Notifications</h1>{% if unread_ids %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn sm">Mark all read</button></form>{% endif %}</div>
{% if items %}<div class="panel" style="padding:6px">{% for n in items %}<a class="row between" style="padding:12px 14px;border-radius:10px;{{ 'background:var(--brand-s)' if not n.read }}" href="{{ url_for('profile.open_notification', nid=n.id) }}"><span>{{ n.text }}</span><span class="muted sm">{{ n.created|ago }}</span></a>{% endfor %}</div>
{% else %}<div class="empty"><h3>You're all caught up</h3><p class="muted">We'll tell you when someone applies, replies or rates you.</p></div>{% endif %}</div>{% endblock %}
